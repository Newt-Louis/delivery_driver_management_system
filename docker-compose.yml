# Local infrastructure for native Node.js development.
# Run the frontend and backend directly on Windows; Docker only runs PostgreSQL and Redis.

networks:
  mall-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: mall_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malldb}
      POSTGRES_USER: ${POSTGRES_USER:-malluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mallpass}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - mall-net
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mall_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "redis-server --appendonly yes --protected-mode yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ./data/redis:/data
    networks:
      - mall-net
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
