# Local infrastructure for native Node.js development.
# Run the frontend and backend directly on Windows; Docker only runs PostgreSQL and Redis.

networks:
  mall-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: mall_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malldb}
      POSTGRES_USER: ${POSTGRES_USER:-malluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mallpass}
    volumes:
      # PostgreSQL owns its data directory as the container's postgres user.
      # Keep this in a Docker-managed volume rather than a WSL bind mount so
      # Linux UID mapping cannot make an existing cluster look inaccessible.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mall-net
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mall_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "redis-server --appendonly yes --protected-mode yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      # Keep Redis AOF/RDB persistence out of the WSL bind mount for the same
      # UID-mapping reason as PostgreSQL above.
      - redis_data:/data
    networks:
      - mall-net
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # An explicit name keeps the development database stable if Compose's project
  # name changes (for example after the repository directory is renamed).
  postgres_data:
    name: delivery_driver_management_postgres_data
  redis_data:
    name: delivery_driver_management_redis_data
